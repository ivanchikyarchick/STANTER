<!DOCTYPE html>
<html lang="uk" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STANTER</title>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Налаштування Tailwind для підтримки темної теми через клас
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#18181b">
    <style>
        body { font-family: 'Roboto Mono', monospace; user-select: none; touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .recording-pulse { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 overflow-hidden h-screen flex flex-col transition-colors duration-300">

    <div id="tab-tracker" class="flex-1 flex flex-col p-6 gap-6">
        <div class="flex justify-between items-center">
            <span class="text-[10px] uppercase tracking-[0.4em] text-zinc-400">STANTER</span>
            
            <div class="flex items-center gap-3">
                <span id="gps-status" class="text-[9px] uppercase tracking-widest text-zinc-400">GPS ВИМК</span>
                <span id="status-label" class="text-[9px] uppercase tracking-widest text-zinc-400">не калібровано</span>
                <button id="theme-toggle" class="p-2 bg-zinc-200 dark:bg-zinc-800 rounded-full text-xs">🌓</button>
            </div>
        </div>

        <div id="display-idle" class="flex-1 flex flex-col items-center justify-center text-center gap-4">
            <div id="last-stunt-box" class="hidden w-full space-y-6">
                <p class="text-[10px] uppercase tracking-[0.4em] text-zinc-400">останній стант</p>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <p class="text-[9px] text-zinc-400 uppercase">км/г</p>
                        <p id="res-speed" class="text-2xl font-light">0.0</p>
                    </div>
                    <div>
                        <p class="text-[9px] text-zinc-400 uppercase">метрів</p>
                        <p id="res-dist" class="text-2xl font-light">0.0</p>
                    </div>
                    <div>
                        <p class="text-[9px] text-zinc-400 uppercase">секунд</p>
                        <p id="res-time" class="text-2xl font-light">0.0</p>
                    </div>
                </div>
            </div>
            <p id="idle-msg" class="text-sm uppercase tracking-[0.2em] text-zinc-400 px-8">чекаю калібрування</p>
        </div>

        <div id="display-active" class="hidden flex-1 flex flex-col items-center justify-center text-center gap-6">
            <div class="text-5xl font-light tracking-[0.3em] recording-pulse text-red-500">СТАНТ</div>
            <div class="flex gap-12">
                <div>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-widest">час</p>
                    <p id="live-time" class="text-5xl font-light">0.0</p>
                </div>
                <div>
                    <p class="text-[10px] text-zinc-400 uppercase tracking-widest">дист</p>
                    <p id="live-dist" class="text-5xl font-light">0.0</p>
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <button id="btn-toggle-rec" class="w-full flex items-center justify-between border-t border-zinc-200 dark:border-zinc-800 pt-4 opacity-30" disabled>
                <span class="text-xs uppercase tracking-[0.3em]">Запис станту</span>
                <div id="toggle-bg" class="h-6 w-11 rounded-full bg-zinc-300 dark:bg-zinc-700 transition-colors relative">
                    <div id="toggle-dot" class="absolute top-1 left-1 h-4 w-4 rounded-full bg-white transition-all"></div>
                </div>
            </button>

            <div class="flex gap-3 text-[10px] uppercase tracking-[0.3em]">
                <button id="btn-calib" class="flex-1 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-bold py-3 rounded-md">калібрувати</button>
                <button id="btn-reset" class="hidden border border-zinc-300 dark:border-zinc-700 px-4 py-3 text-zinc-500 rounded-md">скинути</button>
            </div>
        </div>
    </div>

    <div id="tab-archive" class="hidden flex-1 flex flex-col p-6 gap-6 overflow-hidden">
        <div class="flex justify-between items-center text-[10px] uppercase tracking-[0.4em] text-zinc-400">
            <span>STANTER</span>
            <span id="archive-count">0 записів</span>
        </div>
        
        <div id="best-record" class="hidden border border-zinc-300 dark:border-zinc-700 p-4 flex justify-between items-center rounded-md">
            <span class="text-[10px] uppercase text-zinc-400">рекорд дистанції</span>
            <span class="text-2xl font-light"><span id="best-dist">0</span> м</span>
        </div>

        <div id="session-list" class="flex-1 overflow-y-auto no-scrollbar space-y-2">
            </div>
    </div>

    <nav class="h-16 border-t border-zinc-200 dark:border-zinc-800 flex items-center justify-around bg-zinc-50 dark:bg-zinc-900">
        <button id="nav-tracker" class="flex flex-col items-center gap-1 text-zinc-900 dark:text-zinc-100">
            <span class="text-[10px] uppercase tracking-widest font-bold">Трекер</span>
        </button>
        <button id="nav-archive" class="flex flex-col items-center gap-1 text-zinc-400 dark:text-zinc-500">
            <span class="text-[10px] uppercase tracking-widest">Архів</span>
        </button>
    </nav>

    <script>
        // ТЕМНА ТЕМА
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        
        // Перевіряємо збережену тему
        if (localStorage.getItem('theme') === 'light') {
            htmlElement.classList.remove('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f5');
        }

        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#18181b' : '#f4f4f5');
        });

        // DB Setup
        const db = new Dexie("StanterDB");
        db.version(6).stores({ sessions: '++id, date, duration, distance, avgSpeed', settings: 'key' });

        // State
        let calibrated = false;
        let isStunting = false;
        let recordingEnabled = false;
        
        let calibBeta = 0;
        let currentBeta = 0;
        let calibSamples = [];
        let isCalibrating = false;

        let startTime = null;
        let distance = 0;
        let stuntTimer = null;

        // GPS State
        let watchId = null;
        let lastLat = null;
        let lastLon = null;
        let speedSamples = [];

        // Elements
        const el = (id) => document.getElementById(id);
        const ui = {
            status: el('status-label'),
            gpsStatus: el('gps-status'),
            idleMsg: el('idle-msg'),
            displayIdle: el('display-idle'),
            displayActive: el('display-active'),
            lastStunt: el('last-stunt-box'),
            liveTime: el('live-time'),
            liveDist: el('live-dist'),
            resSpeed: el('res-speed'),
            resDist: el('res-dist'),
            resTime: el('res-time'),
            btnRec: el('btn-toggle-rec'),
            btnCalib: el('btn-calib'),
            btnReset: el('btn-reset'),
            toggleBg: el('toggle-bg'),
            toggleDot: el('toggle-dot'),
            list: el('session-list'),
            bestBox: el('best-record'),
            bestDist: el('best-dist'),
            archCount: el('archive-count'),
            tabTracker: el('tab-tracker'),
            tabArchive: el('tab-archive'),
            navTracker: el('nav-tracker'),
            navArchive: el('nav-archive')
        };

        // Load Settings
        async function initApp() {
            const saved = await db.settings.get('calibration');
            if (saved) {
                calibBeta = saved.val;
                calibrated = true;
                updateCalibUI();
            }
            refreshArchive();
        }
        initApp();

        // Calibration
        ui.btnCalib.onclick = async () => {
            if (isCalibrating) return;

            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('Потрібен дозвіл на доступ до гіроскопа!');
                        return;
                    }
                }
            } catch (e) { console.warn(e); }

            isCalibrating = true;
            calibSamples = [];
            let count = 5;
            ui.btnCalib.innerText = `зачекайте ${count}`;
            ui.btnCalib.disabled = true;
            
            const timer = setInterval(() => {
                count--;
                ui.btnCalib.innerText = `зачекайте ${count}`;
                if (count <= 0) {
                    clearInterval(timer);
                    finishCalib();
                }
            }, 1000);
        };

        function finishCalib() {
            isCalibrating = false;
            ui.btnCalib.disabled = false;
            ui.btnCalib.innerText = 'калібрувати';

            if (calibSamples.length === 0) {
                alert("Немає даних від сенсора. Порухай телефоном і спробуй ще раз.");
                return;
            }

            const sum = calibSamples.reduce((a, b) => a + b, 0);
            calibBeta = sum / calibSamples.length;
            
            db.settings.put({ key: 'calibration', val: calibBeta });
            calibrated = true;
            updateCalibUI();
        }

        ui.btnReset.onclick = () => {
            calibBeta = 0;
            calibrated = false;
            db.settings.delete('calibration');
            updateCalibUI();
        };

        function updateCalibUI() {
            ui.btnReset.classList.toggle('hidden', !calibrated);
            ui.btnRec.disabled = !calibrated;
            ui.btnRec.style.opacity = calibrated ? '1' : '0.3';
            ui.status.innerText = calibrated ? 'ГОТОВО' : 'НЕ КАЛІБРОВАНО';
            ui.idleMsg.innerText = calibrated ? (recordingEnabled ? 'gps працює. чекаю стант' : 'увімкни запис') : 'чекаю калібрування';
        }

        // Гаверсин для дистанції
        function calcDist(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const f1 = lat1 * Math.PI/180;
            const f2 = lat2 * Math.PI/180;
            const df = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(df/2) * Math.sin(df/2) +
                      Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        // Recording & GPS Toggle
        ui.btnRec.onclick = () => {
            recordingEnabled = !recordingEnabled;
            ui.toggleBg.classList.toggle('bg-green-500', recordingEnabled);
            ui.toggleBg.classList.toggle('bg-zinc-300', !recordingEnabled);
            ui.toggleBg.classList.toggle('dark:bg-zinc-700', !recordingEnabled);
            ui.toggleDot.classList.toggle('left-6', recordingEnabled);
            ui.toggleDot.classList.toggle('left-1', !recordingEnabled);
            
            if (recordingEnabled) {
                ui.gpsStatus.innerText = "ПОШУК GPS...";
                ui.gpsStatus.className = "text-[9px] uppercase tracking-widest text-amber-500";
                
                if (!navigator.geolocation) {
                    ui.gpsStatus.innerText = "GPS НЕ ПІДТРИМУЄТЬСЯ";
                    ui.gpsStatus.className = "text-[9px] uppercase tracking-widest text-red-500";
                    return;
                }

                // Вмикаємо GPS
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const { latitude, longitude, speed } = pos.coords;
                        const spdKmh = speed ? (speed * 3.6).toFixed(1) : "0.0";
                        
                        ui.gpsStatus.innerText = `GPS: ${spdKmh} КМ/Г`;
                        ui.gpsStatus.className = "text-[9px] uppercase tracking-widest text-green-500 font-bold";
                        
                        if (isStunting) {
                            if (lastLat !== null) {
                                const moved = calcDist(lastLat, lastLon, latitude, longitude);
                                // Фільтруємо мікро-стрибки GPS (менше 0.2м)
                                if (moved > 0.2) {
                                    distance += moved;
                                    ui.liveDist.innerText = distance.toFixed(1);
                                }
                            }
                            if (speed !== null) speedSamples.push(speed * 3.6);
                        }
                        
                        lastLat = latitude;
                        lastLon = longitude;
                    },
                    (err) => {
                        ui.gpsStatus.className = "text-[9px] uppercase tracking-widest text-red-500 font-bold";
                        if (err.code === 1) ui.gpsStatus.innerText = "НЕМАЄ ДОЗВОЛУ GPS";
                        else if (err.code === 2) ui.gpsStatus.innerText = "СИГНАЛ ВТРАЧЕНО";
                        else if (err.code === 3) ui.gpsStatus.innerText = "ТАЙМАУТ GPS";
                        else ui.gpsStatus.innerText = "ПОМИЛКА GPS";
                        console.warn('GPS Error:', err);
                    },
                    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 } // Збільшив таймаут для стабільності
                );
            } else {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                if (isStunting) stopStunt();
                lastLat = null;
                lastLon = null;
                ui.gpsStatus.innerText = "GPS ВИМК";
                ui.gpsStatus.className = "text-[9px] uppercase tracking-widest text-zinc-400";
            }
            updateCalibUI();
        };

        // Логіка орієнтації
        window.addEventListener('deviceorientation', (e) => {
            currentBeta = e.beta || 0;

            if (isCalibrating) {
                calibSamples.push(currentBeta);
                return;
            }

            if (calibrated && recordingEnabled) {
                let tiltDiff = Math.abs(currentBeta - calibBeta);
                if (tiltDiff > 180) tiltDiff = 360 - tiltDiff;

                if (!isStunting && tiltDiff > 15) startStunt();
                else if (isStunting && tiltDiff < 5) stopStunt();
            }
        });

        function startStunt() {
            isStunting = true;
            startTime = Date.now();
            distance = 0;
            speedSamples = [];
            ui.liveDist.innerText = "0.0";
            ui.displayIdle.classList.add('hidden');
            ui.displayActive.classList.remove('hidden');

            stuntTimer = setInterval(() => {
                ui.liveTime.innerText = ((Date.now() - startTime)/1000).toFixed(1);
            }, 100);
        }

        async function stopStunt() {
            isStunting = false;
            clearInterval(stuntTimer);
            
            const dur = (Date.now() - startTime) / 1000;
            
            if (dur > 1.0) {
                let finalSpeed = 0;
                if (speedSamples.length > 0) {
                    finalSpeed = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                } else if (dur > 0 && distance > 0) {
                    finalSpeed = (distance / dur) * 3.6;
                }

                const res = { 
                    date: new Date(), 
                    duration: +dur.toFixed(1), 
                    distance: +distance.toFixed(1), 
                    avgSpeed: +finalSpeed.toFixed(1) 
                };
                await db.sessions.add(res);
                showLastResult(res);
                refreshArchive();
            }
            ui.displayActive.classList.add('hidden');
            ui.displayIdle.classList.remove('hidden');
        }

        function showLastResult(res) {
            ui.lastStunt.classList.remove('hidden');
            ui.idleMsg.classList.add('hidden');
            ui.resSpeed.innerText = res.avgSpeed;
            ui.resDist.innerText = res.distance;
            ui.resTime.innerText = res.duration;
        }

        // Navigation
        ui.navTracker.onclick = () => switchTab('tracker');
        ui.navArchive.onclick = () => switchTab('archive');

        function switchTab(tab) {
            ui.tabTracker.classList.toggle('hidden', tab !== 'tracker');
            ui.tabArchive.classList.toggle('hidden', tab !== 'archive');
            
            ui.navTracker.className = `flex flex-col items-center gap-1 ${tab === 'tracker' ? 'text-zinc-900 dark:text-zinc-100' : 'text-zinc-400 dark:text-zinc-500'}`;
            ui.navArchive.className = `flex flex-col items-center gap-1 ${tab === 'archive' ? 'text-zinc-900 dark:text-zinc-100' : 'text-zinc-400 dark:text-zinc-500'}`;
        }

        async function refreshArchive() {
            const sessions = await db.sessions.orderBy('date').reverse().toArray();
            ui.archCount.innerText = `${sessions.length} записів`;
            
            if (sessions.length > 0) {
                const best = sessions.reduce((a, b) => a.distance > b.distance ? a : b);
                ui.bestBox.classList.remove('hidden');
                ui.bestDist.innerText = best.distance;
            }

            ui.list.innerHTML = sessions.map(s => `
                <div class="bg-zinc-200 dark:bg-zinc-800 p-4 rounded-md">
                    <div class="flex justify-between text-[10px] text-zinc-500 mb-2">
                        <span>${s.date.toLocaleDateString()} ${s.date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="grid grid-cols-3 text-center">
                        <div><p class="text-[9px] text-zinc-400 uppercase">км/г</p><p class="text-lg">${s.avgSpeed}</p></div>
                        <div><p class="text-[9px] text-zinc-400 uppercase">м</p><p class="text-lg">${s.distance}</p></div>
                        <div><p class="text-[9px] text-zinc-400 uppercase">сек</p><p class="text-lg">${s.duration}</p></div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
